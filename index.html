<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Prêmio Nestlé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Comic+Neue:wght@700&display=swap">
  <style>
    :root {
      --bg: #0d0016;
      --card: #1a0630;
      --opt: #2b0b4a;
      --lime: #c6ff00;
      --pink: #ff2bd6;
      --cyan: #00e5ff;
      --yellow: #ffe600;
      --soft: #d9c6ff;
      --red: #ff4d6d;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    [hidden] { display: none !important }
    html, body { height: 100% }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(60vmax 60vmax at 10% 0%, rgba(255,43,214,.35), transparent 60%),
        radial-gradient(60vmax 60vmax at 100% 30%, rgba(0,229,255,.25), transparent 60%),
        radial-gradient(60vmax 60vmax at 30% 100%, rgba(198,255,0,.18), transparent 60%);
      animation: bgshift 8s ease-in-out infinite alternate;
    }
    body::after { /* scanlines CRT */
      content: ''; position: fixed; inset: 0; z-index: 50; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    }
    @keyframes bgshift { to { filter: hue-rotate(80deg) } }

    /* ── Tira de fotos + ticker (fixos no topo, fora da área de scroll) ── */
    .strip { flex: none; position: relative; z-index: 3; overflow: hidden; background: #000; border-bottom: 3px solid var(--lime) }
    .strip-track { display: flex; gap: 4px; width: max-content; will-change: transform }
    .strip-track img { flex: none }
    /* scrollbar custom */
    @supports not selector(::-webkit-scrollbar) { .options, .screen.scroll { scrollbar-color: var(--pink) #12031f } }
    .options::-webkit-scrollbar, .screen.scroll::-webkit-scrollbar { width: 14px }
    .options::-webkit-scrollbar-track, .screen.scroll::-webkit-scrollbar-track { background: #12031f; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--cyan) }
    .options::-webkit-scrollbar-thumb, .screen.scroll::-webkit-scrollbar-thumb { background: repeating-linear-gradient(45deg, var(--pink) 0 8px, #ff7be8 8px 16px); border: 3px solid #000; border-radius: 0 }
    .options::-webkit-scrollbar-thumb:hover, .screen.scroll::-webkit-scrollbar-thumb:hover { background: var(--lime) }
    .options::-webkit-scrollbar-button, .screen.scroll::-webkit-scrollbar-button { display: none }
    .strip-track img { height: 60px; width: auto; display: block; filter: saturate(1.4) contrast(1.1) }
    .ticker { flex: none; position: relative; z-index: 3; overflow: hidden; white-space: nowrap; background: var(--pink); color: #000; font-family: 'Bungee', sans-serif; font-size: 12px; padding: 4px 0; border-bottom: 3px solid #000 }
    .ticker-track { display: inline-block; animation: slide 28s linear infinite }
    @keyframes slide { to { transform: translateX(-50%) } }

    /* ── Shell: ocupa o resto da tela, sem scroll da página ── */
    .shell {
      position: relative; z-index: 2;
      flex: 1; min-height: 0;
      width: 100%; max-width: 640px; margin-inline: auto;
      display: flex; flex-direction: column;
      padding-block: 10px 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    }

    /* ── Header compacto ── */
    .header { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px }
    .logobox { flex: none; display: grid; place-items: center; min-width: 54px; min-height: 54px; padding: 4px 6px; background: #fff; border: 3px solid #000; box-shadow: 3px 3px 0 var(--pink); transform: rotate(-4deg) }
    .logo { height: 46px; width: auto; display: block }
    .nest { font-size: 34px; line-height: 1; display: inline-block; animation: wobble 2.5s ease-in-out infinite }
    @keyframes wobble { 0%,100% { transform: rotate(-6deg) scale(1) } 50% { transform: rotate(6deg) scale(1.08) } }
    .titlewrap { display: flex; align-items: center; gap: 10px }
    .title {
      font-family: 'Anton', Impact, sans-serif; font-weight: 400;
      font-size: clamp(22px, 6.4vw, 52px); line-height: 1; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
      text-shadow: 3px 0 var(--pink), -3px 0 var(--cyan);
      animation: glitch 2.4s infinite;
    }
    .year { font-family: 'Bungee', sans-serif; font-size: 12px; flex: none; background: var(--yellow); color: #000; padding: 2px 9px; border: 3px solid #000; transform: rotate(-5deg); box-shadow: 3px 3px 0 var(--pink) }
    @keyframes glitch {
      0%, 90%, 100% { transform: none; text-shadow: 3px 0 var(--pink), -3px 0 var(--cyan) }
      92% { transform: translate(-4px, 2px) skewX(6deg); text-shadow: -6px 0 var(--pink), 6px 0 var(--cyan) }
      94% { transform: translate(4px, -2px); text-shadow: 6px 0 var(--lime), -6px 0 var(--pink) }
      96% { transform: translate(-2px, 0) skewX(-6deg) }
    }

    /* ── Telas ── */
    .screen { display: none }
    .screen.active { display: flex; flex-direction: column; flex: 1; min-height: 0; animation: pop .35s ease both }
    .screen.scroll.active { display: block; overflow-y: auto; padding: 0 10px 10px 0 }
    @keyframes pop { from { transform: scale(.97) translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }

    /* ── Progresso ── */
    #progress { flex: none }
    .aura-top { display: flex; justify-content: space-between; font-family: 'Bungee', sans-serif; font-size: 12px; color: var(--lime); margin-bottom: 4px }
    .bar { height: 16px; border: 3px solid #000; background: #2a0a45; box-shadow: 3px 3px 0 var(--cyan); overflow: hidden; margin-bottom: 12px }
    .fill { height: 100%; width: 0; transition: width .4s; background: repeating-linear-gradient(45deg, var(--lime) 0 12px, #9be000 12px 24px); background-size: 34px 34px; animation: stripes .6s linear infinite }
    @keyframes stripes { to { background-position: 34px 0 } }

    #steps { flex: 1; min-height: 0; display: flex; flex-direction: column }
    .step { display: none }
    .step.active { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: pop .3s ease both }

    /* ── Card: cabeçalho fixo, só a lista de opções rola (se precisar) ── */
    .card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; background: var(--card); border: 4px solid #000; box-shadow: 6px 6px 0 var(--pink); padding: 14px; margin: 0 8px 14px 0 }
    .head { flex: none; display: flow-root }
    .tag { display: inline-block; font-family: 'Bungee', sans-serif; font-size: 10px; background: var(--cyan); color: #000; padding: 3px 8px; transform: rotate(-2deg); margin-bottom: 6px }
    .qtitle { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(24px, 6.5vw, 40px); text-transform: uppercase; line-height: 1; margin-bottom: 4px }
    .desc { color: var(--soft); font-size: 14px; margin-bottom: 10px }
    .sticker { float: right; width: 76px; margin: 0 0 6px 10px; transform: rotate(4deg); border: 3px solid #fff; box-shadow: 3px 3px 0 #000; background: #000; position: relative }
    .sticker img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 25%; max-width: 100% }
    .sticker b { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 12px; line-height: 1; color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000 }

    /* ── Opções ── */
    .options { flex: 1; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 10px; padding: 2px 8px 8px 2px }
    .opt {
      display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; text-align: left;
      font: inherit; color: #fff; background: var(--opt);
      border: 3px solid #000; box-shadow: 3px 3px 0 var(--cyan);
      padding: 7px 12px; cursor: pointer;
      transition: transform .08s, box-shadow .08s;
      -webkit-tap-highlight-color: transparent;
    }
    .opt:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--cyan) }
    .opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--cyan) }
    .opt[aria-checked="true"] { background: var(--yellow); color: #000; box-shadow: 3px 3px 0 var(--pink); animation: shake .35s }
    @keyframes shake { 0%,100% { transform: none } 25% { transform: rotate(-1.5deg) scale(1.02) } 75% { transform: rotate(1.5deg) scale(1.02) } }
    .av { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: #000; border: 2px solid #fff; overflow: hidden }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block }
    .nm { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 20px; text-transform: uppercase; letter-spacing: .5px; min-width: 0; overflow-wrap: anywhere }
    .ck { margin-left: auto; flex: none; font-family: 'Bungee', sans-serif; font-size: 10px; opacity: 0; color: #000 }
    .opt[aria-checked="true"] .ck { opacity: 1 }

    /* ── Opções em cards grandes com foto ── */
    .options.pics { grid-template-columns: 1fr 1fr; gap: 14px 12px }
    .options.pics .opt { flex-direction: column; align-items: stretch; gap: 0; padding: 0; position: relative; text-align: center }
    .options.pics .av { width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; border: 0; border-bottom: 3px solid #000; font-size: 64px }
    .options.pics .nm { padding: 8px 6px; font-size: 19px }
    .options.pics .ck { position: absolute; top: 6px; right: 6px; margin: 0; padding: 3px 6px; background: var(--lime); border: 2px solid #000; transform: rotate(6deg) }
    .options.pics.solo { grid-template-columns: minmax(0, 260px); justify-content: center }
    @media (min-width: 900px) {
      .options.pics.many { grid-template-columns: repeat(3, 1fr) }
      .options.pics .nm { font-size: 22px }
    }

    .ta { flex: 1; min-height: 100px; width: 100%; resize: none; font: inherit; color: #fff; background: var(--opt); border: 3px solid #000; box-shadow: 3px 3px 0 var(--cyan); padding: 12px 14px; outline: none }
    .ta:focus { box-shadow: 3px 3px 0 var(--lime) }
    .ta::placeholder { color: #a58fd0 }

    .hint { flex: none; display: none; margin-top: 8px; font-family: 'Bungee', sans-serif; font-size: 11px; color: var(--red) }
    .hint.show { display: block; animation: shake .35s }
    .err { flex: none; display: none; margin-bottom: 12px; padding: 10px 12px; border: 3px solid #000; background: var(--red); color: #000; font-size: 15px }
    .err.show { display: block }

    /* ── Botões ── */
    .nav { flex: none; display: flex; gap: 14px; margin: 0 8px 0 0 }
    .btn { font-family: 'Bungee', sans-serif; font-size: 15px; text-transform: uppercase; border: 3px solid #000; padding: 12px 16px; cursor: pointer; color: #000; -webkit-tap-highlight-color: transparent; transition: transform .08s, box-shadow .08s }
    .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000 !important }
    .btn:disabled { opacity: .5; cursor: wait }
    .btn-go { flex: 1; background: var(--lime); box-shadow: 4px 4px 0 var(--pink) }
    .btn-back { flex: none; background: #fff; box-shadow: 4px 4px 0 var(--cyan) }
    :focus-visible { outline: 3px dashed var(--lime); outline-offset: 3px }

    /* ── Tela do nome / já votou / fim ── */
    .namecard { display: block; text-align: center; margin-top: 4px }
    .namecard .qtitle { margin-bottom: 8px }
    .namecard .nav { margin: 0 }
    .name-input { width: 100%; font: inherit; font-size: 20px; text-align: center; color: #fff; background: var(--opt); border: 3px solid #000; box-shadow: 3px 3px 0 var(--cyan); padding: 12px; outline: none; margin: 6px 0 14px }
    .name-input:focus { box-shadow: 3px 3px 0 var(--lime) }
    .big { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(34px, 9vw, 60px); line-height: 1; text-transform: uppercase; text-align: center; color: var(--lime); text-shadow: 3px 3px 0 #000; margin-bottom: 10px }
    .center { text-align: center; color: var(--soft); margin-bottom: 18px }

    .summary { display: grid; gap: 10px; padding-right: 4px }
    .sum { background: var(--card); border: 3px solid #000; box-shadow: 3px 3px 0 var(--cyan); padding: 8px 14px; min-width: 0 }
    .sum small { display: block; font-family: 'Bungee', sans-serif; font-size: 10px; color: var(--cyan); text-transform: uppercase }
    .sum span { display: block; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 20px; text-transform: uppercase; color: var(--yellow); overflow-wrap: anywhere }

    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; padding: 0 4px 4px }
    .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 3px solid #fff; box-shadow: 3px 3px 0 #000; max-width: 100% }
    .gallery img:nth-child(odd) { transform: rotate(-3deg) }
    .gallery img:nth-child(even) { transform: rotate(3deg) }

    /* ── Efeitos ── */
    .fx { position: fixed; z-index: 100; pointer-events: none; font-size: 26px; animation: burst .9s ease-out forwards }
    .fx.txt { font-family: 'Bungee', sans-serif; font-size: 18px; color: var(--lime); text-shadow: 2px 2px 0 #000 }
    @keyframes burst { from { transform: translate(0, 0) scale(.6); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--r)); opacity: 0 } }
    .fall { position: fixed; top: -40px; z-index: 100; pointer-events: none; animation: fall linear forwards }
    @keyframes fall { to { transform: translateY(115vh) rotate(720deg) } }

    /* ── Desktop: 2 colunas ── */
    @media (min-width: 900px) {
      .strip-track img { height: 80px }
      .ticker { font-size: 13px }
      .shell { max-width: 920px; padding-block: 14px 18px }
      .logo { height: 58px }
      .logobox { min-width: 66px; min-height: 66px }
      .card { padding: 20px 24px }
      .sticker { width: 118px }
      .sticker b { font-size: 16px }
      .options { grid-template-columns: 1fr 1fr; gap: 10px 14px }
      .nav { max-width: 440px; margin: 0 auto; width: 100% }
      .summary { grid-template-columns: 1fr 1fr }
      .gallery { grid-template-columns: repeat(6, 1fr) }
      .namecard { max-width: 520px; margin-inline: auto }
    }
    @media (min-width: 900px) and (max-height: 900px) {
      .strip-track img { height: 60px }
      .opt { padding: 5px 12px }
      .av { width: 34px; height: 34px }
      .nm { font-size: 18px }
    }
    /* telas baixas: aperta o cabeçalho pra sobrar espaço pras opções */
    @media (max-height: 760px) {
      .header { margin-bottom: 6px }
      .logo { height: 36px }
      .logobox { min-width: 44px; min-height: 44px }
      
      .bar { margin-bottom: 8px }
      .desc { margin-bottom: 8px }
      .sticker { width: 64px }
    }
    @media (max-height: 640px) {
      .ticker { display: none }
      .strip-track img { height: 44px }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important }
    }
  </style>
</head>
<body>
  <div class="strip" aria-hidden="true"><div class="strip-track" id="strip"></div></div>
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <div class="shell">
    <header class="header">
      <span class="logobox">
        <!-- Logo preto em img/nestle-logo.png. Sem o arquivo aparece o ninho 🪺 -->
        <img class="logo" id="logo" src="img/nestle-logo.png" alt="Nestlé" hidden>
        <span class="nest" id="nest">🪺</span>
      </span>
      <div class="titlewrap">
        <h1 class="title">Prêmio Nestlé</h1>
        <span class="year" id="year"></span>
      </div>
    </header>

    <!-- Nome -->
    <section class="screen scroll active" id="screen-name">
      <div class="card namecard">
        <span class="tag">IDENTIFICAÇÃO</span>
        <h2 class="qtitle">Quem é você, sigma?</h2>
        <p class="desc">Coloca seu nome pra registrar o voto. Cada um vota uma vez só.</p>
        <input class="name-input" id="voter-name" type="text" maxlength="40" placeholder="SEU NOME" autocomplete="off" aria-label="Seu nome">
        <p class="hint" id="hint-name">COLOCA O NOME, NPC 💀</p>
        <div class="nav"><button class="btn btn-go" id="btn-start" type="button">Bora votar →</button></div>
      </div>
    </section>

    <!-- Já votou -->
    <section class="screen scroll" id="screen-voted">
      <div class="big">Já votou!<br>+10000 aura</div>
      <p class="center">Seus votos tão salvos, <span id="voted-name"></span>.</p>
      <div class="summary" id="voted-summary"></div>
    </section>

    <!-- Formulário -->
    <section class="screen" id="screen-form">
      <div id="progress">
        <div class="aura-top"><span id="aura">AURA 0%</span><span id="cnt"></span></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
      <div id="steps"></div>
    </section>

    <!-- Fim -->
    <section class="screen scroll" id="screen-done">
      <div class="big">Voto registrado!<br>+99999 aura 🗿</div>
      <p class="center">Valeu por votar. A cerimônia vai revelar os vencedores.</p>
      <div class="summary" id="done-summary"></div>
      <div class="gallery" id="gallery"></div>
    </section>
  </div>

  <script>
  (function () {
    'use strict';

    // ═══ CONFIGURAÇÃO ═══════════════════════════════════════════════════════
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1pGQ3x10KcbHqxNlIcRyv7x2yLbcAS99HeDGyQcP0co8-m7oh8Bz5-Sl4hXhxUsdp/exec';   // URL do Google Apps Script
    const ANO = 2026;                                       // ano exibido e usado na trava de voto
    const PHOTOS = Array.from({ length: 13 }, (_, i) => 'img/p' + String(i + 1).padStart(2, '0') + '.jpg');

    // Fotos individuais: coloque em img/avatars/<nome-sem-acento>.jpg
    // ex.: Eric -> img/avatars/eric.jpg | "Júlio e Allana" -> img/avatars/julio-e-allana.jpg
    // Se o arquivo não existir, aparece um emoji no lugar.
    const AVATAR_DIR = 'img/avatars/';

    const TODOS = ['Acácio', 'Braga', 'Eric', 'Henricão', 'João Calado', 'Joe', 'Neguinho', 'Lucas', 'Luiz', 'Gsantos',
      'Pedro Neves', 'Reche', 'Samuel', 'Flores', 'Davi', 'Dodo', 'Júlio', 'LeoMo', 'Victinho'];

    // photo = nº da foto (1-12) usada como sticker na categoria
    // options: texto, ou { v: valor salvo, l: texto exibido }
    const CATEGORIES = [
      { key: 'amigo_ano', tag: 'AURA INFINITA', title: 'Amigo Nestlé do Ano', desc: 'Quem tem mais aura no grupo? Só um sigma leva a taça.', type: 'radio', options: TODOS, photo: 1, cap: 'AURA +9999', emojis: ['🗿', '🐐', '🔥', '😎'] },
      { key: 'amiga_ano', tag: 'RIZZ SUPREMO', title: 'AmigA Nestlé do Ano', desc: 'A rainha da aura. Vota sem medo.', type: 'radio', options: ['Maricota', 'Feh Mel', 'Gabi Reche'], photo: 10, cap: 'RIZZ MÁXIMO', emojis: ['👑', '✨', '💅'] },
      { key: 'golden_boy', tag: 'MEWING LVL 100', title: 'Golden Boy', desc: 'Flores ou Eric. Escolhe sem pensar.', type: 'radio', options: ['Flores', 'Eric'], photo: 6, cap: 'MEWING', emojis: ['🌟', '🏅'] },
      { key: 'pior_amigo', tag: 'NPC DETECTED', title: 'Pior Amigo Nestlé do Ano', desc: 'Aura negativa. Quem foi o NPC do ano?', type: 'radio', options: TODOS, photo: 7, cap: 'NPC', emojis: ['💀', '🤡', '🥶'] },
      { key: 'resenha_ano', tag: 'ARQUIVO CLASSIFICADO', title: 'Resenha do Ano', desc: 'Qual resenha entrou pra história? Escolhe o rolê.', type: 'radio', options: ['Unfollow do Sam na Feh', 'Live avaliando insta', 'Iris seguindo nois', 'Bet do Samuca', 'Piscininha'], photo: 10, cap: 'LORE DROP', emojis: ['📉', '📱', '👀', '🎰', '🏊'] },
      { key: 'premio_ceo', tag: 'CEO MODE', title: 'Prêmio CEO', desc: 'Candidato único. Confirma o voto.', type: 'radio', options: ['Luiz, obviamente', 'Luiz (mas com dúvidas)', 'Luiz (sem dúvida nenhuma)'], photo: 7, cap: 'SIGMA GRINDSET', emojis: ['👔', '🤔', '🏆'], avatarFor: () => 'luiz' },
      { key: 'story_samuca', tag: 'LORE DO ANO', title: 'Story do Samuca do Ano', desc: 'Qual story ficou marcado? Escolhe um.', type: 'radio', options: ['Pose c mão no bolso', 'Foto na academia', 'Foto dirigindo', 'Selfie com maxilar'], photo: 1, cap: 'SKIBIDI', emojis: ['🧍', '💪', '🚗', '🗿'] },
      { key: 'premio_neve', tag: 'MODO GELO', title: 'Prêmio Neve do Ano', desc: 'Escolhe a dupla.', type: 'radio', options: [{ v: 'Gsantos e Lucas', l: 'Gsantos × Lucas' }, { v: 'Samuel e Acácio', l: 'Samuel × Acácio' }], photo: 7, cap: 'NÍVEL OHIO', emojis: ['🥶', '🧊'] },
      { key: 'premio_piscineira', tag: 'MODO PISCINA', title: 'Prêmio Piscineira', desc: 'Candidato único. Confirma o voto.', type: 'radio', options: ['Piscini'], photo: 6, cap: 'FANUM TAX', emojis: ['🏊'] },
      { key: 'fioti_ano', tag: 'CRINGE LVL MÁXIMO', title: 'Fioti do Ano', desc: 'Escolhe um dos três.', type: 'radio', options: ['João Calado', 'Eric', 'Samuel'], photo: 10, cap: 'CRINGE', emojis: ['🤡', '💀', '🗿'] },
      { key: 'casal_ano', tag: 'ROMANCE ARC', title: 'Casal do Ano', desc: 'Vota no ship do ano.', type: 'radio', options: ['Júlio e Allana', 'Léo e Degaut', 'Samuel e Feh Mel', 'Reche e Gabi'], photo: 1, cap: 'TÁ LIBERADO', emojis: ['💍', '💘', '🫶', '🔥'] },
    ];

    const TICKER = ['NESTLÉ', 'AURA', 'SIGMA', 'OHIO', 'SKIBIDI', 'FANUM TAX', 'RIZZ', 'MEWING', 'NPC', 'TÁ LIBERADO'];
    // ════════════════════════════════════════════════════════════════════════

    const LS_KEY = 'nestle' + ANO + '_vote';
    const N = CATEGORIES.length;
    const state = { cur: 0, nome: '', answers: {} };
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $ = (s) => document.querySelector(s);

    function h(tag, attrs, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else e.setAttribute(k, v);
      }
      for (const c of kids.flat()) { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); }
      return e;
    }
    const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    // ── Cabeçalho, tira de fotos, ticker ──────────────────────────────────
    $('#year').textContent = String(ANO);
    document.title = 'Prêmio Nestlé ' + ANO;
    const logo = $('#logo');
    logo.addEventListener('load', () => { logo.hidden = false; $('#nest').hidden = true; });
    if (logo.complete && logo.naturalWidth) { logo.hidden = false; $('#nest').hidden = true; }
    const strip = $('#strip');
    // Faixa de fotos: ordem aleatória, sem repetir a mesma foto nas 3 seguintes, rolagem infinita
    (function initStrip() {
      const ratios = [];
      let pending = PHOTOS.length;
      const recent = [];
      const SPEED = 60; // px/s
      function pick() {
        const pool = PHOTOS.map((_, i) => i).filter((i) => !recent.includes(i));
        const i = pool[Math.floor(Math.random() * pool.length)];
        recent.push(i); if (recent.length > 3) recent.shift();
        return i;
      }
      function mk() {
        const i = pick();
        return h('img', { src: PHOTOS[i], alt: '', style: 'aspect-ratio:' + ratios[i] });
      }
      function start() {
        let offset = 0, last = performance.now();
        const view = () => strip.parentElement.clientWidth;
        const fill = () => {
          while (strip.scrollWidth - offset < view() * 2 + 400) strip.append(mk());
        };
        fill();
        function frame(now) {
          offset += (now - last) / 1000 * SPEED; last = now;
          let first = strip.firstElementChild;
          while (first && offset >= first.offsetWidth + 4) {
            offset -= first.offsetWidth + 4; first.remove(); first = strip.firstElementChild;
          }
          fill();
          strip.style.transform = 'translateX(' + (-offset) + 'px)';
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      PHOTOS.forEach((p, i) => {
        const im = new Image();
        const done = () => { ratios[i] = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 1; if (!--pending) start(); };
        im.onload = done; im.onerror = done; im.src = p;
      });
    })();
    const tk = TICKER.join('  •  ') + '  •  ';
    $('#ticker').textContent = tk.repeat(8);

    // ── Telas ─────────────────────────────────────────────────────────────
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      $('#screen-' + name).classList.add('active');
      $('#screen-' + name).scrollTop = 0;
    }

    // ── Efeitos ───────────────────────────────────────────────────────────
    function burst(x, y) {
      if (reduce) return;
      const em = ['💀', '🗿', '🔥', '✨', '😭', '🐐'];
      for (let i = 0; i < 8; i++) {
        const f = h('span', { class: 'fx', text: em[Math.floor(Math.random() * em.length)] });
        const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
        f.style.left = x + 'px'; f.style.top = y + 'px';
        f.style.setProperty('--dx', Math.cos(a) * d + 'px');
        f.style.setProperty('--dy', Math.sin(a) * d - 30 + 'px');
        f.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
        f.addEventListener('animationend', () => f.remove());
        document.body.append(f);
      }
      const t = h('span', { class: 'fx txt', text: '+AURA' });
      t.style.left = (x - 24) + 'px'; t.style.top = (y - 20) + 'px';
      t.style.setProperty('--dx', '0px'); t.style.setProperty('--dy', '-60px'); t.style.setProperty('--r', '0deg');
      t.addEventListener('animationend', () => t.remove());
      document.body.append(t);
    }
    function confetti() {
      if (reduce) return;
      const em = ['🎉', '🗿', '💀', '🔥', '🏆', '✨', '🐐', '🪺'];
      for (let i = 0; i < 40; i++) {
        const f = h('span', { class: 'fall', text: em[i % em.length] });
        f.style.left = Math.random() * 100 + 'vw';
        f.style.fontSize = 20 + Math.random() * 20 + 'px';
        f.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
        f.style.animationDelay = Math.random() * 1.2 + 's';
        f.addEventListener('animationend', () => f.remove());
        document.body.append(f);
      }
    }

    // ── Avatar (foto individual ou emoji) ─────────────────────────────────
    function avatar(value, emoji, slugOverride) {
      const av = h('span', { class: 'av', text: emoji });
      const img = new Image();
      img.alt = '';
      img.onload = () => { av.textContent = ''; av.append(img); };
      img.src = AVATAR_DIR + (slugOverride || slug(value)) + '.jpg';
      return av;
    }

    // ── Montagem dos passos ───────────────────────────────────────────────
    function optionEl(cat, o, k) {
      const v = typeof o === 'string' ? o : o.v;
      const l = typeof o === 'string' ? o : o.l;
      const emoji = (cat.emojis || ['🗿'])[k % (cat.emojis || ['🗿']).length];
      const b = h('button', { type: 'button', class: 'opt', role: 'radio', 'aria-checked': 'false', 'data-val': v },
        avatar(v, emoji, cat.avatarFor && cat.avatarFor(v)), h('span', { class: 'nm', text: l }), h('span', { class: 'ck', text: 'AURA +500' }));
      b.addEventListener('click', (ev) => {
        b.parentElement.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-checked', x === b ? 'true' : 'false'));
        state.answers[cat.key] = v;
        setHint(cat.key, false);
        const r = b.getBoundingClientRect();
        const x = ev.detail === 0 ? r.left + r.width / 2 : ev.clientX;
        const y = ev.detail === 0 ? r.top + r.height / 2 : ev.clientY;
        burst(x, y);
        if (navigator.vibrate) navigator.vibrate(25);
      });
      return b;
    }

    function setHint(key, on) { const e = $('#hint-' + key); if (e) e.classList.toggle('show', on); }

    function buildStep(cat, i) {
      const last = i === N - 1;
      const card = h('div', { class: 'card' }, h('div', { class: 'head' },
        h('div', { class: 'sticker' }, h('img', { src: PHOTOS[cat.photo - 1], alt: '' }), h('b', { text: cat.cap })),
        h('span', { class: 'tag', text: cat.tag }),
        h('h2', { class: 'qtitle', text: cat.title }),
        h('p', { class: 'desc', text: cat.desc })));
      if (cat.type === 'text') {
        const ta = h('textarea', { class: 'ta', rows: '4', maxlength: '400', placeholder: cat.placeholder || '', 'aria-label': cat.title });
        ta.addEventListener('input', () => { state.answers[cat.key] = ta.value.trim(); if (ta.value.trim()) setHint(cat.key, false); });
        card.append(ta);
      } else {
        card.append(h('div', { class: 'options pics' + (cat.options.length > 4 ? ' many' : '') + (cat.options.length === 1 ? ' solo' : ''), role: 'radiogroup', 'aria-label': cat.title }, cat.options.map((o, k) => optionEl(cat, o, k))));
      }
      card.append(h('p', { class: 'hint', id: 'hint-' + cat.key, text: 'FALTOU VOTAR, SIGMA 💀' }));

      const nav = h('div', { class: 'nav' });
      if (i > 0) { const b = h('button', { type: 'button', class: 'btn btn-back', 'aria-label': 'Voltar', text: '←' }); b.addEventListener('click', () => go(i - 1)); nav.append(b); }
      const go_ = h('button', { type: 'button', class: 'btn btn-go', text: last ? 'Enviar votos 🏆' : 'Próximo →' });
      go_.addEventListener('click', () => {
        if (!state.answers[cat.key]) { setHint(cat.key, true); return; }
        if (last) submit(go_); else go(i + 1);
      });
      nav.append(go_);
      const step = h('div', { class: 'step' }, card, nav);
      if (last) step.insertBefore(h('div', { class: 'err', id: 'err' }), nav);
      return step;
    }

    const stepsEl = $('#steps');
    CATEGORIES.forEach((c, i) => stepsEl.append(buildStep(c, i)));

    function go(i) {
      state.cur = i;
      [...stepsEl.children].forEach((s, k) => s.classList.toggle('active', k === i));
      stepsEl.children[i].querySelectorAll('.options, .ta').forEach((e) => { e.scrollTop = 0; });
      const pct = Math.round(i / N * 100);
      $('#fill').style.width = pct + '%';
      $('#aura').textContent = 'AURA ' + pct + '%';
      $('#cnt').textContent = (i + 1) + '/' + N;
    }

    // ── Nome ──────────────────────────────────────────────────────────────
    function start() {
      const input = $('#voter-name');
      const name = input.value.trim();
      if (!name) { $('#hint-name').classList.add('show'); input.focus(); return; }
      state.nome = name;
      showScreen('form');
      go(0);
    }
    $('#btn-start').addEventListener('click', start);
    $('#voter-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });

    // ── Resumo ────────────────────────────────────────────────────────────
    function fillSummary(box, data) {
      box.textContent = '';
      for (const cat of CATEGORIES) {
        if (!data[cat.key]) continue;
        box.append(h('div', { class: 'sum' }, h('small', { text: cat.title }), h('span', { text: data[cat.key] })));
      }
    }

    // ── Envio ─────────────────────────────────────────────────────────────
    async function submit(btn) {
      const err = $('#err');
      err.classList.remove('show');
      btn.disabled = true; btn.textContent = 'Enviando...';
      const payload = Object.assign({}, state.answers, { nome: state.nome, timestamp: new Date().toISOString() });
      try {
        if (!SCRIPT_URL || SCRIPT_URL.includes('COLE_A_URL')) throw new Error('config');
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
        try { localStorage.setItem(LS_KEY, JSON.stringify(payload)); } catch (_) {}
        showDone(payload);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Enviar votos 🏆';
        err.textContent = e.message === 'config' ? 'SCRIPT_URL ainda não foi configurada no index.html.' : 'Deu ruim no envio. Confere a internet e tenta de novo.';
        err.classList.add('show');
      }
    }

    function showDone(data) {
      fillSummary($('#done-summary'), data);
      const g = $('#gallery');
      g.textContent = '';
      PHOTOS.forEach((p) => g.append(h('img', { src: p, alt: '', loading: 'lazy' })));
      showScreen('done');
      confetti();
    }

    // ── Início: já votou neste aparelho? ──────────────────────────────────
    try {
      const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      if (saved && saved.nome) {
        $('#voted-name').textContent = saved.nome;
        fillSummary($('#voted-summary'), saved);
        showScreen('voted');
      }
    } catch (_) {}
  })();
  </script>
</body>
</html>
